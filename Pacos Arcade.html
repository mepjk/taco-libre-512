function musicStop(){if(mus.timer){clearInterval(mus.timer);mus.timer=0}if(mus.gain){try{mus.gain.disconnect()}catch{}mus.gain=null}mus.on=false;mus.id=null}
function musicSync(){const want=sfx&&phase==='play'&&game?game.id:null;
 if(!want){if(mus.on)musicStop();return}
 if(mus.on&&mus.id===want)return;
 try{if(mus.on)musicStop();audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});
  mus.gain=audioCtx.createGain();mus.gain.gain.value=.7;mus.gain.connect(audioCtx.destination);
  mus.id=want;mus.on=true;mus.step=0;mus.lead=musicBuild(want);mus.next=audioCtx.currentTime+.08;musicTick();mus.timer=setInterval(()=>{try{musicTick()}catch{musicStop()}},50)}catch{musicStop()}}
let engine,group='All games';
const filters=['All games','Quick play','Ring sports','Puzzles','Adventure'];
function catalog(){const shown=games.filter(g=>group==='All games'||g.category===group);$('#count').textContent=shown.length+' games';$('.catalog').innerHTML=shown.map(g=>'<button class="gamecard" data-game="'+g.id+'" aria-label="Play '+g.name+'"><span class="cover" style="--bg:'+g.color+'"><span class="badge">'+g.category+'</span><img alt="" src="'+ART[g.art]+'"></span><span class="cardtext"><strong>'+g.name+'</strong><small>'+g.tag+'</small></span></button>').join('');$('.filters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===group)))}
filters.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{group=name;catalog()};$('.filters').append(b)});catalog();document.querySelectorAll('[data-art]').forEach(el=>el.src=ART[el.dataset.art]);
function trigger(k){if(phase==='play')engine.act?.(k)}
function controls(){const holder=$('.controls');holder.replaceChildren();for(const [k,name] of engine.controls()){const b=document.createElement('button');b.textContent=name;b.dataset.key=k;b.classList.toggle('action',k==='action');let pressed=false;
 const release=()=>{pressed=false;keys.delete(k);b.classList.remove('down')};
 b.onpointerdown=e=>{if(phase!=='play')return;e.preventDefault();b.setPointerCapture(e.pointerId);pressed=true;keys.add(k);b.classList.add('down');trigger(k)};b.onpointerup=release;b.onlostpointercapture=release;b.onpointercancel=release;b.onclick=e=>{if(e.detail===0&&!pressed)trigger(k)};holder.append(b)}}
function render(dt){ctx.clearRect(0,0,W,H);engine.draw();feedbackDraw(dt)}
function loop(ts){musicSync();if(phase==='lobby')return;const dt=Math.min(.04,Math.max(0,(ts-last)/1000));last=ts;if(phase==='play'){elapsed+=dt;engine.step(dt*(1+.1*(level-1)));render(dt)}anim=requestAnimationFrame(loop)}
function setup(g){cancelAnimationFrame(anim);game=g;engine=engines[g.id];phase='ready';s={life:3};points=elapsed=0;roundBest=read(g.id);keys.clear();fx=[];$('#lobby').hidden=true;$('#player').hidden=false;$('#title').textContent=g.name;$('#kind').textContent=g.category.toUpperCase()+(level>1?' · ROUND '+level:'');$('#goal').textContent=g.goal;$('#how').textContent=g.guide;$('#score').textContent='0';$('#best').textContent=roundBest;$('#feedback').textContent='';metric('ROUND','1');$('.pause').disabled=true;$('.board').hidden=true;engine.init();controls();render(0);overlay('PACO’S ARCADE',g.name,g.tag,'Start round');$('#again').focus({preventScroll:true});last=performance.now();anim=requestAnimationFrame(loop)}
function begin(){phase='play';$('.controls').inert=false;$('.board').inert=false;$('.overlay').hidden=true;$('.pause').disabled=false;keys.clear();last=performance.now();tone(480);if(!$('.board').hidden)$('.board button').focus({preventScroll:true});else c.focus({preventScroll:true})}
$('#again').onclick=()=>{if(phase==='paused')pause();else{if(phase==='over'){level=lastWon?Math.min(level+1,6):1;setup(game)}begin()}};
$('.pause').onclick=pause;$('.sound').onclick=()=>{sfx=!sfx;$('.sound').textContent=sfx?'Sound on':'Sound off';$('.sound').setAttribute('aria-pressed',String(sfx));if(sfx)tone(550);musicSync()};
function currentRoute(){const id=location.hash.slice(1);const g=games.find(g=>g.id===id);if(g){level=1;setup(g)}else{cancelAnimationFrame(anim);phase='lobby';keys.clear();$('#player').hidden=true;$('#lobby').hidden=false}musicSync();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-game]');if(b)location.hash=b.dataset.game});$('.back').onclick=()=>location.hash='lobby';window.addEventListener('hashchange',currentRoute);
const mapKey=k=>({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',Space:'action'})[k];
document.addEventListener('keydown',e=>{if(phase==='lobby')return;if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(!e.repeat)pause();return}if(phase!=='play')return;
 if(game.id==='whack'&&/^[1-9]$/.test(e.key)){e.preventDefault();if(!e.repeat)engine.tap(Number(e.key)-1);return}
 if(e.target.closest('button,a')&&(e.code==='Space'||e.code==='Enter'))return;
 const k=mapKey(e.code);if(k){e.preventDefault();if(!keys.has(k)){keys.add(k);trigger(k)}}});document.addEventListener('keyup',e=>keys.delete(mapKey(e.code)));
const point=e=>{if(phase!=='play')return;const r=c.getBoundingClientRect();engine.point?.((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)};c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);point(e);c.focus({preventScroll:true})};c.onpointermove=e=>{if(c.hasPointerCapture(e.pointerId)&&game.id==='catch')point(e)};
window.addEventListener('blur',()=>{keys.clear();if(phase==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')pause()});currentRoute();
</script></body></html>
